name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_DATABASE: nexora_erp_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, zip, dom, curl, openssl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: Backend/vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('Backend/composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      # SQLite: the default suite. Fast, and it keeps the MySQL-only SQL covered
      # by the driver-aware expressions in DashboardController and ReportController.
      - name: Run test suite (SQLite)
        run: php artisan test --colors=always

      # MySQL: exercises the engine production actually uses - real DECIMAL/INT
      # types and row locking, which SQLite cannot reproduce.
      - name: Run test suite (MySQL)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: nexora_erp_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan migrate:fresh --force --no-interaction && vendor/bin/pest -c phpunit.mysql.xml

      # Note: `pint --test` is intentionally not a gate. It already fails on the
      # untouched files in config/, bootstrap/ and public/ (line endings plus a
      # missing trailing newline), so enabling it would require reformatting the
      # whole repository as a prerequisite for any CI run.

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build